name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: island-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Tests
        run: node --test
      - name: Versionsnummer pruefen
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Ungueltige Versionsnummer.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag und package.json stimmen nicht ueberein.' }
          "ISLAND_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Native Windows-Anwendung erstellen
        shell: powershell
        run: ./scripts/build-windows.ps1
      - name: Windows-Tray pruefen
        shell: powershell
        run: ./scripts/test-windows.ps1
      - name: Node-Erststart mit offiziellem Download pruefen
        shell: powershell
        run: ./scripts/test-node-runtime.ps1 -Download
      - name: Windows-Tray ohne System-Node pruefen
        shell: powershell
        run: ./scripts/test-windows.ps1 -PortableNode
      - name: ZIP und Pruefsumme erstellen
        run: node scripts/package.mjs --windows
      - name: Update und Rollback unter Windows pruefen
        shell: powershell
        run: ./scripts/test-update.ps1
      - name: Release mit Downloads veroeffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:ISLAND_RELEASE_VERSION
          $tag = "v$version"
          $name = "Island-Now-$version-windows.zip"
          $zip = Join-Path 'dist' $name
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $section = [regex]::Match($changelog, ('(?ms)^## ' + [regex]::Escape($version) + '\r?\n(.*?)(?=^## |\z)'))
          if (-not $section.Success) { throw 'Release-Eintrag im CHANGELOG fehlt.' }
          $notes = "Island Now $version`n`n" + $section.Groups[1].Value.Trim() + "`n`nZIP vollstaendig entpacken und Island-Now.exe starten. Fehlendes Node.js wird beim ersten Start automatisch lokal eingerichtet (Internet erforderlich, keine Adminrechte). Vorhandene Nutzer behalten ihren .data- und runtime-Ordner."
          $notesFile = Join-Path $env:RUNNER_TEMP 'island-release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding UTF8
          $existingDraft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingDraft.Trim() -ne 'true') { throw 'Dieses Release ist bereits veroeffentlicht. Fuer ein neues Update die Versionsnummer erhoehen.' }
            gh release upload $tag $zip "$zip.sha256" --clobber
          } else {
            gh release create $tag $zip "$zip.sha256" --draft --target $env:GITHUB_SHA --title "Island Now $version" --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release-Upload fehlgeschlagen. Ein vorhandener Entwurf kann mit erneutem Workflow-Start fortgesetzt werden.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht veroeffentlicht werden.' }
